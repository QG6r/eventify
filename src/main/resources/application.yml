spring:
  application:
    name: eventify
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/eventify}
    username: ${DB_USER:eventify}
    password: ${DB_PASSWORD:eventify}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-min-32-bytes-long-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  booking:
    expiry-minutes: ${BOOKING_EXPIRY_MINUTES:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html