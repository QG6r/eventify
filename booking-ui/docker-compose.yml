

services:
  # 1. Frontend in Docker with mock data (demo)
  frontend-mocks:
    build:
      context: .
      args:
        REACT_APP_USE_MOCKS: "true"
    ports:
      - "3000:80"
    profiles:
      - docker-mocks
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Frontend in Docker with a real backend (port 8080 must be free)
  frontend-backend:
    build:
      context: .
      args:
        # The URL is used by the browser, not by the container, so it is localhost
        REACT_APP_API_URL: http://localhost:8080
        REACT_APP_USE_MOCKS: "false"
    ports:
      - "3000:80"
    profiles:
      - docker-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: event-booking-network 